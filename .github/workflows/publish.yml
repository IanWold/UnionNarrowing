name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Publish
    permissions:
      contents: read
      id-token: write
    env:
      # Deterministic paths in the shipped analyzer assemblies.
      ContinuousIntegrationBuild: true
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test --no-build -c Release
    - name: Pack
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: dotnet pack --no-build -c Release -o artifacts -p:PackageVersion="${TAG#v}"
    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push artifacts/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
